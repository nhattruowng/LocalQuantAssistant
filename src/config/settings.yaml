app:
  name: LocalQuant Assistant
  environment: local

database:
  driver: sqlite
  path: data/localquant.db

logging:
  level: INFO
  serialize: false

data:
  min_bars: 60

collector:
  exchange: binance
  symbols: [BTC/USDT, ETH/USDT]
  timeframes: [15m, 1h, 4h]
  candles_limit: 200
  retry_attempts: 3
  retry_delay_seconds: 1.0

features:
  fast_ma_window: 10
  slow_ma_window: 30
  volatility_window: 14
  breakout_lookback: 20
  output_dir: data/processed
  drop_warmup_rows: true

feature_toggles:
  price_action: true
  trend: true
  momentum: true
  volatility: true
  volume: true

market_regime:
  trend_strength_threshold: 0.01
  high_volatility_threshold: 0.04
  breakout_buffer_pct: 0.002
  sideway_trend_threshold: 0.005
  sideway_bollinger_width_threshold: 0.04
  sideway_atr_percent_threshold: 0.02
  breakout_window: 20
  breakout_volume_ratio_threshold: 1.5
  breakout_atr_percent_threshold: 0.015
  high_volatility_percentile: 0.8
  low_volatility_percentile: 0.2
  volatility_percentile_window: 100

model:
  path: null
  fallback_action_probability: 0.62
  fallback_wait_probability: 0.23
  fallback_opposite_probability: 0.15

risk:
  account_balance: 10000.0
  risk_per_trade_pct: 0.01
  stop_loss_pct: 0.01
  take_profit_pct: 0.02

signal:
  min_confidence: 0.55
  min_risk_reward: 1.5
