app:
  name: LocalQuant Assistant
  environment: local

database:
  driver: sqlite
  path: data/localquant.db

logging:
  level: INFO
  serialize: false

data:
  min_bars: 60

collector:
  exchange: binance
  symbols: [BTC/USDT, ETH/USDT]
  timeframes: [15m, 1h, 4h]
  candles_limit: 200
  retry_attempts: 3
  retry_delay_seconds: 1.0

features:
  fast_ma_window: 10
  slow_ma_window: 30
  volatility_window: 14
  breakout_lookback: 20
  output_dir: data/processed
  drop_warmup_rows: true

feature_toggles:
  price_action: true
  trend: true
  momentum: true
  volatility: true
  volume: true

market_regime:
  trend_strength_threshold: 0.01
  high_volatility_threshold: 0.04
  breakout_buffer_pct: 0.002
  sideway_trend_threshold: 0.005
  sideway_bollinger_width_threshold: 0.04
  sideway_atr_percent_threshold: 0.02
  breakout_window: 20
  breakout_volume_ratio_threshold: 1.5
  breakout_atr_percent_threshold: 0.015
  high_volatility_percentile: 0.8
  low_volatility_percentile: 0.2
  volatility_percentile_window: 100

model:
  path: null
  fallback_action_probability: 0.62
  fallback_wait_probability: 0.23
  fallback_opposite_probability: 0.15

risk:
  account_balance: 10000.0
  risk_per_trade_pct: 0.01
  stop_loss_pct: 0.01
  take_profit_pct: 0.02
  stop_loss_atr_multiplier: 1.5
  take_profit_1_atr_multiplier: 2.0
  take_profit_2_atr_multiplier: 3.0

signal:
  min_confidence: 0.55
  min_risk_reward: 2.0
  trend_probability_threshold: 0.65
  breakout_probability_threshold: 0.65
  mean_reversion_probability_threshold: 0.60
  ema_near_pct: 0.01
  breakout_volume_ratio_threshold: 1.2
  support_resistance_near_pct: 0.01
  trend_buy_rsi_min: 40.0
  trend_buy_rsi_max: 70.0
  trend_sell_rsi_min: 30.0
  trend_sell_rsi_max: 60.0
  mean_reversion_buy_rsi_max: 35.0
  mean_reversion_sell_rsi_min: 65.0
  model_score_weight: 0.40
  trend_score_weight: 0.25
  indicator_score_weight: 0.20
  volume_score_weight: 0.10
  risk_reward_score_weight: 0.05

labeling:
  lookahead_bars: 10
  stop_loss_atr_multiplier: 1.5
  take_profit_atr_multiplier: 3.0

training:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
  n_estimators: 300
  max_depth: null
  model_dir: models
