app:
  name: LocalQuant Assistant
  environment: local

database:
  driver: sqlite
  path: data/localquant.db

logging:
  level: INFO
  serialize: false

data:
  min_bars: 60

collector:
  exchange: binance
  symbols: [BTC/USDT, ETH/USDT]
  timeframes: [15m, 1h, 4h]
  candles_limit: 200
  retry_attempts: 3
  retry_delay_seconds: 1.0

features:
  fast_ma_window: 10
  slow_ma_window: 30
  volatility_window: 14
  breakout_lookback: 20
  output_dir: data/processed
  drop_warmup_rows: true

feature_toggles:
  price_action: true
  trend: true
  momentum: true
  volatility: true
  volume: true

market_regime:
  trend_strength_threshold: 0.01
  high_volatility_threshold: 0.04
  breakout_buffer_pct: 0.002
  sideway_trend_threshold: 0.005
  sideway_bollinger_width_threshold: 0.04
  sideway_atr_percent_threshold: 0.02
  breakout_window: 20
  breakout_volume_ratio_threshold: 1.5
  breakout_atr_percent_threshold: 0.015
  high_volatility_percentile: 0.8
  low_volatility_percentile: 0.2
  volatility_percentile_window: 100

adaptive_strategy:
  enabled: false
  base_threshold: 0.65
  min_opinion_score: 0.55
  conflict_margin: 0.12
  high_uncertainty_threshold: 0.45
  require_calibrated_probability: false
  allow_grade_c_signal: false
  memory_lookback_trades: 30
  memory_lookback_bars: 200
  memory_min_trades_required: 10
  memory_max_score_penalty: 0.20
  memory_max_size_penalty: 0.50
  memory_block_after_consecutive_losses: true

reasoning_brain:
  enabled: false
  min_confluence_score: 0.68
  medium_score_threshold: 0.58
  strong_conflict_threshold: 0.25
  allow_reduced_size_for_medium_score: true
  max_conflict_penalty: 0.30

model:
  path: null
  fallback_action_probability: 0.62
  fallback_wait_probability: 0.23
  fallback_opposite_probability: 0.15

risk:
  account_balance: 10000.0
  risk_per_trade_pct: 0.01
  stop_loss_pct: 0.01
  take_profit_pct: 0.02
  stop_loss_atr_multiplier: 1.5
  take_profit_1_atr_multiplier: 2.0
  take_profit_2_atr_multiplier: 3.0
  dynamic_sizing_enabled: true
  max_risk_per_trade_pct: 1.0
  min_risk_reward: 2.0

safety_filters:
  mean_reversion_danger_enabled: true
  breakout_fakeout_defense_enabled: true
  extreme_volatility_block: true
  higher_timeframe_conflict_block: true
  mean_reversion_danger_threshold: 0.70
  breakout_fakeout_threshold: 0.55

risk_guard:
  enabled: false
  max_trades_per_day: 5
  max_consecutive_losses: 3
  max_daily_drawdown_pct: 0.05
  max_weekly_drawdown_pct: 0.10
  max_open_positions: 1
  min_time_between_trades_minutes: 30
  cooldown_minutes_after_block: 60
  require_calibrated_model: false
  block_low_regime_confidence: false

signal:
  min_confidence: 0.55
  min_risk_reward: 2.0
  use_calibrated_probability: true
  trend_probability_threshold: 0.65
  breakout_probability_threshold: 0.65
  mean_reversion_probability_threshold: 0.60
  ema_near_pct: 0.01
  breakout_volume_ratio_threshold: 1.2
  support_resistance_near_pct: 0.01
  trend_buy_rsi_min: 40.0
  trend_buy_rsi_max: 70.0
  trend_sell_rsi_min: 30.0
  trend_sell_rsi_max: 60.0
  mean_reversion_buy_rsi_max: 35.0
  mean_reversion_sell_rsi_min: 65.0
  model_score_weight: 0.40
  trend_score_weight: 0.25
  indicator_score_weight: 0.20
  volume_score_weight: 0.10
  risk_reward_score_weight: 0.05
  strategy_ensemble:
    enabled: false
    min_strategy_score: 0.55
    conflict_margin: 0.10
    low_regime_confidence_threshold: 0.55
  multi_timeframe:
    enabled: false
    primary_timeframe: 15m
    confirmation_timeframes: [1h, 4h]
    conflict_penalty: 0.35
    require_higher_tf_alignment: false

labeling:
  lookahead_bars: 10
  stop_loss_atr_multiplier: 1.5
  take_profit_atr_multiplier: 3.0

training:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
  n_estimators: 300
  max_depth: null
  model_dir: models
  validation:
    method: time_split
    n_splits: 5
    train_window_bars: 500
    validation_window_bars: 100
    expanding_window: true
    embargo_size: 0
  calibration:
    enabled: true
    method: sigmoid
    cv: prefit
  regime_specific:
    enabled: false
    min_samples_per_regime: 200
    allowed_regimes: [UPTREND, DOWNTREND, SIDEWAY, BREAKOUT_UP, BREAKOUT_DOWN]
    min_validation_accuracy: 0.0
  registry:
    auto_promote_champion: true

backtest:
  fee_rate: 0.001
  slippage_rate: 0.0005
  cooldown_bars_after_loss: 3
  max_holding_bars: 10
  volatility_low_max: 0.01
  volatility_normal_max: 0.025
  volatility_high_max: 0.05
  execution_cost:
    model: fixed
    fee_rate: 0.001
    base_slippage_rate: 0.0005
    stress_multiplier: 3.0
    max_slippage_rate: 0.01
    volatility_multiplier: 10.0
    estimated_spread_rate: 0.0005
  output_dir: data/backtest

notification:
  enabled: false
  min_confidence: 0.70
  min_risk_reward: 2.0
  cooldown_seconds: 900
  request_timeout_seconds: 5.0

paper_trading:
  enabled: false
  initial_balance: 10000.0
